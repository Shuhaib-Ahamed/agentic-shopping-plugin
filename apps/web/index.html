<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4A2E82" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="googlebot" content="index, follow" />

    <title>Juno - your Kapruka shopping agent | gifts, flowers, cakes, delivery in Sri Lanka</title>
    <meta
      name="description"
      content="Chat with Juno to shop Kapruka - Sri Lanka's largest local store. Find the right birthday gift, fresh flowers, cakes, or combos, plan island-wide delivery, and check out fast in English, Sinhala, Tamil, or Tanglish."
    />
    <meta
      name="keywords"
      content="Kapruka, Sri Lanka gifts, flowers Sri Lanka, cake delivery Colombo, online shopping Sri Lanka, gift delivery Sri Lanka, birthday gifts, AI shopping assistant, conversational commerce"
    />
    <meta name="author" content="Kapruka" />

    <!--
      Update this base URL if the agent is hosted somewhere other than the
      main Kapruka domain. Canonical, og:url, and JSON-LD all derive from it.
    -->
    <link rel="canonical" href="https://kapruka.com/" />
    <link rel="alternate" hreflang="en" href="https://kapruka.com/?lang=en" />
    <link rel="alternate" hreflang="si" href="https://kapruka.com/?lang=si" />
    <link rel="alternate" hreflang="ta" href="https://kapruka.com/?lang=ta" />
    <link rel="alternate" hreflang="x-default" href="https://kapruka.com/" />

    <!-- Favicons - single SVG covers all sizes; modern iOS/Android also accept SVG. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#4A2E82" />

    <!-- Open Graph - for link unfurls in Slack, WhatsApp, Facebook, LinkedIn. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kapruka" />
    <meta property="og:url" content="https://kapruka.com/" />
    <meta property="og:title" content="Juno - your Kapruka shopping agent" />
    <meta
      property="og:description"
      content="Chat with Juno to shop Kapruka. Gifts, flowers, cakes, and combos with island-wide delivery, in English, Sinhala, Tamil, or Tanglish."
    />
    <meta property="og:image" content="https://kapruka.com/favicon.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta
      property="og:image:alt"
      content="Juno, the Kapruka shopping assistant mascot - a friendly chat bubble with a yellow accent dot"
    />
    <meta property="og:locale" content="en_LK" />
    <meta property="og:locale:alternate" content="si_LK" />
    <meta property="og:locale:alternate" content="ta_LK" />

    <!-- Twitter / X card. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Juno - your Kapruka shopping agent" />
    <meta
      name="twitter:description"
      content="Shop Kapruka by chatting. Find gifts, flowers, cakes, and check out - in English, Sinhala, Tamil, or Tanglish."
    />
    <meta name="twitter:image" content="https://kapruka.com/favicon.svg" />
    <meta name="twitter:image:alt" content="Juno, the Kapruka shopping assistant mascot" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured data - helps Google understand the site is an organisation
         with a search-driven storefront and a multilingual assistant. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://kapruka.com/#website",
            "url": "https://kapruka.com/",
            "name": "Kapruka",
            "description": "Sri Lanka's largest local store - gifts, flowers, cakes, electronics, and groceries delivered island-wide.",
            "inLanguage": ["en", "si", "ta"],
            "publisher": { "@id": "https://kapruka.com/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://kapruka.com/?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "Organization",
            "@id": "https://kapruka.com/#organization",
            "name": "Kapruka",
            "url": "https://kapruka.com/",
            "logo": "https://kapruka.com/favicon.svg",
            "areaServed": "LK",
            "sameAs": [
              "https://www.facebook.com/kapruka",
              "https://www.instagram.com/kapruka"
            ]
          },
          {
            "@type": "SoftwareApplication",
            "name": "Juno",
            "applicationCategory": "ShoppingApplication",
            "operatingSystem": "Web",
            "description": "AI shopping assistant for Kapruka. Finds gifts, flowers, cakes, and combos, plans delivery, and completes checkout via chat.",
            "inLanguage": ["en", "si", "ta"],
            "publisher": { "@id": "https://kapruka.com/#organization" },
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "LKR" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif; max-width: 540px; margin: 64px auto; color: #161624;">
        Juno is an interactive shopping assistant for Kapruka. Please enable
        JavaScript to chat with Juno and browse gifts, flowers, cakes, and
        delivery options across Sri Lanka.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
